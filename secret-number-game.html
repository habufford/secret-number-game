<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret Number Game</title>
</head>

<body>

    <h1>Secret Number Game</h1>

    <p>Try to guess my favorite number between 1 and 5!</p>

    <script>

        // Create the secret number
        let secretNumber = 3;

        // Create the player's points
        let points = 0;

        // Ask the user for a guess
        let guess = prompt("What is my favorite number between 1 and 5?");

        // Convert the guess to a number
        guess = Number(guess);

        // Keep asking until the user enters a number
        while (isNaN(guess)) {

            guess = prompt("Please enter a number between 1 and 5.");

            guess = Number(guess);
        }

        // Check the guess
        if (guess === secretNumber) {

            points = 10;

            alert("Congratulations! You guessed my favorite number! You earned " + points + " points.");

        } else {

            points = 0;

            alert("Sorry! You did not guess my favorite number. You earned " + points + " points.");

        }

    </script>

</body>

</html>
